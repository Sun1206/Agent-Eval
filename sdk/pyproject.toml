[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-scope-sdk"
version = "0.1.0"
description = "AgentScope Python SDK - AI Agent 评测与可观测性 Trace 采集"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AgentScope Team" },
]
keywords = ["agent", "observability", "tracing", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/agentscope/agent-scope-sdk"
Repository = "https://github.com/agentscope/agent-scope-sdk"

[tool.hatch.build.targets.wheel]
packages = ["agent_scope"]